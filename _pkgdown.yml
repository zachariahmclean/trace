url: https://zachariahmclean.github.io/trace/
template:
  bootstrap: 5
reference:
- title: Main functions
  desc:  Process fsa files to generate instability metrics using these three functions
- contents:
  - read_fsa
  - trace
  - calculate_instability_metrics
- title: Plotting functions
  desc:  Explore data through plots
- contents:
  - starts_with("plot_")
- title: Ladder fixing
  desc:  Functions for fixing ladders
- contents:
  - starts_with("fix_ladders")
- title: Helper functions
  desc:  Useful functions for extracting information samples or modifying lists of objects
- contents:
  - starts_with("extract_")
  - remove_fragments
  - load_config
- title: Import data
  desc:  Import data from non-fsa formats as a peak table or repeat table
- contents:
  - genemapper_table_to_fragments
  - repeat_table_to_fragments
  - size_table_to_fragments
- title: Package objects
  desc:  documentation for objects used in this package
- contents:
  - fragments
- title: Example data
  desc:  A collection of data that can be used for example analyses
- contents:
  - cell_line_fsa_list
  - metadata
  - starts_with("example_data")


